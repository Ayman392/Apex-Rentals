<svg width="880" height="124" viewBox="0 0 880 124" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tile { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; }
    .label { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
    .icon-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 800; text-anchor: middle; }
  </style>

  <!-- Row 1 -->
  <!-- Next.js -->
  <g transform="translate(20, 12)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <circle cx="24" cy="22" r="11" fill="#000000" stroke="#475569" stroke-width="1"/>
    <text x="24" y="26" fill="#FFFFFF" class="icon-text">N</text>
    <text x="46" y="26" class="label">Next.js 16</text>
  </g>

  <!-- TypeScript -->
  <g transform="translate(190, 12)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#3178C6"/>
    <text x="24" y="26" fill="#FFFFFF" class="icon-text">TS</text>
    <text x="46" y="26" class="label">TypeScript</text>
  </g>

  <!-- React -->
  <g transform="translate(360, 12)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <circle cx="24" cy="22" r="11" fill="#0EA5E9" fill-opacity="0.15"/>
    <circle cx="24" cy="22" r="3" fill="#38BDF8"/>
    <ellipse cx="24" cy="22" rx="9" ry="3.5" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
    <ellipse cx="24" cy="22" rx="9" ry="3.5" fill="none" stroke="#38BDF8" stroke-width="1.2" transform="rotate(60 24 22)"/>
    <ellipse cx="24" cy="22" rx="9" ry="3.5" fill="none" stroke="#38BDF8" stroke-width="1.2" transform="rotate(120 24 22)"/>
    <text x="46" y="26" class="label">React</text>
  </g>

  <!-- Tailwind CSS -->
  <g transform="translate(530, 12)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#06B6D4" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#22D3EE" class="icon-text">TW</text>
    <text x="46" y="26" class="label">Tailwind CSS</text>
  </g>

  <!-- Framer Motion -->
  <g transform="translate(700, 12)">
    <rect width="160" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#FF0055" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#FB7185" class="icon-text">FM</text>
    <text x="46" y="26" class="label">Framer Motion</text>
  </g>

  <!-- Row 2 -->
  <!-- Better Auth -->
  <g transform="translate(20, 68)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#334155"/>
    <text x="24" y="26" fill="#F8FAFC" class="icon-text">BA</text>
    <text x="46" y="26" class="label">Better Auth</text>
  </g>

  <!-- Express.js -->
  <g transform="translate(190, 68)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="24" y="26" fill="#E2E8F0" class="icon-text">EX</text>
    <text x="46" y="26" class="label">Express.js</text>
  </g>

  <!-- MongoDB -->
  <g transform="translate(360, 68)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#47A248" fill-opacity="0.2"/>
    <text x="24" y="26" fill="#4ADE80" class="icon-text">M</text>
    <text x="46" y="26" class="label">MongoDB</text>
  </g>

  <!-- Stripe -->
  <g transform="translate(530, 68)">
    <rect width="156" height="44" rx="10" class="tile"/>
    <rect x="13" y="11" width="22" height="22" rx="5" fill="#635BFF"/>
    <text x="24" y="26" fill="#FFFFFF" class="icon-text">S</text>
    <text x="46" y="26" class="label">Stripe</text>
  </g>

  <!-- Vercel -->
  <g transform="translate(700, 68)">
    <rect width="160" height="44" rx="10" class="tile"/>
    <polygon points="24,14 33,30 15,30" fill="#FFFFFF"/>
    <text x="46" y="26" class="label">Vercel</text>
  </g>
</svg>
